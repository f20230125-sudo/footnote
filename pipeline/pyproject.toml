[project]
name = "footnote"
version = "0.1.0"
description = "A filings analyst scored on FinanceBench: every answer carries its page citation."
requires-python = ">=3.12"
dependencies = [
  "pymupdf>=1.26",
  "pydantic>=2.8",
  "httpx>=0.27",
  "numpy>=2.0",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
