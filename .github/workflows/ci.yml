name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # No FinanceBench data and no keys here: the data-dependent test skips itself, and every model
      # call in the suite goes to a scripted fake.
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Generates Next's route types first, then runs tsc.
      - run: npm run typecheck
      # Includes the parity test: the browser search must rank pages exactly as the Python search
      # did when the data files were exported.
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Drives the production build in a real browser: searches, the chart, accessibility scans in
      # both themes, the security headers, and a phone-sized screen.
      - run: npm run e2e
        env:
          CI: "1"
      - name: Keep the traces of failed end-to-end tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
